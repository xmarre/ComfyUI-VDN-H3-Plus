name: release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read package version
        id: version
        shell: bash
        run: |
          version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid project version: ${version}" >&2
            exit 1
          fi

          python - "${version}" <<'PY'
          from pathlib import Path
          import sys

          version = sys.argv[1]
          lines = Path("RELEASE_NOTES.md").read_text(encoding="utf-8").splitlines()
          heading = next((line.strip() for line in lines if line.strip()), "")
          if f"v{version}" not in heading:
              raise SystemExit(
                  f"RELEASE_NOTES.md first heading must identify v{version}; got {heading!r}"
              )
          PY

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Prepare current GitHub release body
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lines = Path("RELEASE_NOTES.md").read_text(encoding="utf-8").splitlines()
          if not lines or not lines[0].startswith("# "):
              raise SystemExit("RELEASE_NOTES.md must start with a level-1 release heading")

          end = len(lines)
          for index, line in enumerate(lines[1:], start=1):
              if line.startswith("# "):
                  end = index
                  break

          body = "\n".join(lines[1:end]).strip() + "\n"
          if not body.strip():
              raise SystemExit("GitHub release body is empty after removing the release heading")
          Path("CURRENT_RELEASE_NOTES.md").write_text(body, encoding="utf-8")
          PY

      - name: Refuse stale or duplicate release
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ "${RELEASE_SHA}" != "${current_main}" ]]; then
            echo "Tested commit ${RELEASE_SHA} is no longer current main (${current_main}); skipping stale release."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; leaving it unchanged."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "publish=true" >> "${GITHUB_OUTPUT}"

      - name: Build release archive
        if: steps.gate.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          mkdir -p dist
          archive="ComfyUI-VDN-H3-Plus-v${VERSION}.zip"
          git archive \
            --format=zip \
            --prefix="ComfyUI-VDN-H3-Plus-v${VERSION}/" \
            --output="dist/${archive}" \
            HEAD
          (cd dist && sha256sum "${archive}" > SHA256SUMS)

      - name: Publish GitHub release
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release create "${TAG}" \
            "dist/ComfyUI-VDN-H3-Plus-v${VERSION}.zip" \
            dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${RELEASE_SHA}" \
            --title "ComfyUI-VDN-H3-Plus ${TAG}" \
            --notes-file CURRENT_RELEASE_NOTES.md
