[project]
name = "comfyui-vdn-h3-plus"
version = "1.5.4"
description = "VDN-H3-Plus hybrid attention for ComfyUI MiniMax-H3 with pre-quantized or self-built INT8 ConvRot VDN stages"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Saganaki22" },
  { name = "xmarre" },
]
keywords = ["comfyui", "minimax-h3", "vdn", "video", "attention"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
training = [
  "prodigy-plus-schedule-free==2.0.1",
]

# This repository is a flat-layout ComfyUI custom node and also contains non-Python
# top-level directories (web/assets/example_workflows). Setuptools' automatic flat
# discovery rejects that layout, which made `pip install -e '.[training]'` fail before
# it could install the optional trainer dependency. Only vdn_h3 is an installable
# Python package; the custom-node checkout itself continues to own the root __init__.py
# and frontend/assets in place.
[tool.setuptools.packages.find]
include = ["vdn_h3*"]
exclude = ["tests*", "tools*", "web*", "assets*", "example_workflows*"]

[project.urls]
Repository = "https://github.com/xmarre/ComfyUI-VDN-H3-Plus"
Issues = "https://github.com/xmarre/ComfyUI-VDN-H3-Plus/issues"
Upstream = "https://github.com/Saganaki22/ComfyUI-VDN-H3"
OpenVDN = "https://github.com/OpenVDN/vdn-minimax-h3"

[tool.comfy]
PublisherId = "xmarre"
DisplayName = "ComfyUI-VDN-H3-Plus"
Icon = "https://avatars.githubusercontent.com/u/84208527"
