[project]
name = "comfyui-vdn-h3"
version = "1.5.2"
description = "VDN-H3 hybrid attention for ComfyUI MiniMax-H3 with pre-quantized or self-built INT8 ConvRot VDN stages"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Saganaki22" },
  { name = "xmarre" },
]
keywords = ["comfyui", "minimax-h3", "vdn", "video", "attention"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Repository = "https://github.com/xmarre/ComfyUI-VDN-H3-Plus"
Issues = "https://github.com/xmarre/ComfyUI-VDN-H3-Plus/issues"
Upstream = "https://github.com/Saganaki22/ComfyUI-VDN-H3"
OpenVDN = "https://github.com/OpenVDN/vdn-minimax-h3"

[tool.comfy]
PublisherId = "xmarre"
DisplayName = "ComfyUI-VDN-H3"
Icon = "https://avatars.githubusercontent.com/u/84208527"
